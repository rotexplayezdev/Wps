name: Build ROTEXOS APK

# Repository -> Actions -> Build ROTEXOS APK -> Run workflow -> download artifact "ROTEXOS-APK" -> install.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract ROTEXOS project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="ROTEXOS_Full_Launcher_Project_v2.zip"
          WORK="$GITHUB_WORKSPACE/_rotexos_build"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          # 1) exact name anywhere in the repo, 2) any ROTEXOS*.zip (GitHub may rename on upload)
          ZIP_PATH="$(find "$GITHUB_WORKSPACE" -type f -iname "$ZIP_NAME" -not -path '*/.git/*' -not -path "$WORK/*" -print -quit)"
          if [ -z "$ZIP_PATH" ]; then
            ZIP_PATH="$(find "$GITHUB_WORKSPACE" -type f -iname 'ROTEXOS*.zip' -not -path '*/.git/*' -not -path "$WORK/*" -print -quit)"
          fi

          if [ -n "$ZIP_PATH" ]; then
            echo "Found project ZIP: $ZIP_PATH"
            if command -v unzip >/dev/null 2>&1; then
              unzip -q -o "$ZIP_PATH" -d "$WORK"
            else
              python3 -m zipfile -e "$ZIP_PATH" "$WORK"
            fi
            SEARCH_ROOT="$WORK"
          else
            echo "::warning::$ZIP_NAME was not found. Looking for an already-extracted project in the repository."
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          SETTINGS="$(find "$SEARCH_ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.git/*' -not -path '*/__MACOSX/*' -not -path '*/build/*' -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle found. Upload $ZIP_NAME to the repository root (next to the .github folder)."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle not found next to $SETTINGS. The ZIP structure is not a valid Android project."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "settings: $SETTINGS"
          echo "project dir: $PROJECT_DIR"
          ls -la "$PROJECT_DIR" "$PROJECT_DIR/app"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (preinstalled on ubuntu-latest)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found; relying on Gradle to use the preinstalled SDK"
          else
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" \
              || echo "::warning::sdkmanager could not install packages; continuing with the preinstalled SDK"
          fi
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK (assembleDebug)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          "$GRADLE_CMD" --no-daemon --stacktrace clean assembleDebug \
            -PversionCode="${{ github.run_number }}" \
            -PgithubOwner="${{ github.repository_owner }}" \
            -PgithubRepo="${{ github.event.repository.name }}"

      - name: Verify app-debug.apk exists
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::app-debug.apk was not produced at $APK"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi
          ls -l "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload artifact ROTEXOS-APK
        uses: actions/upload-artifact@v4
        with:
          name: ROTEXOS-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
